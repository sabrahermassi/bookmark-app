name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: bookmarks
          POSTGRES_PASSWORD: bookmarks
          POSTGRES_DB: bookmarks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookmarks -d bookmarks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: echo "DATABASE_URL=postgresql://bookmarks:bookmarks@localhost:5432/bookmarks" > .env
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint .
      - run: npm test
